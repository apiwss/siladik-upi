services:
  - type: web
    name: siladik-upi
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: siladik-db
          property: connectionString

databases:
  - name: siladik-db
    plan: free
    region: singapore
    databaseName: siladik_db
    user: siladik_user
